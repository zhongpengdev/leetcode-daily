<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Chat</title>
  <style>
    body { font-family: monospace; max-width: 600px; margin: 40px auto; }
    #log { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; margin-bottom: 12px; }
    .system { color: #888; }
    .mine { color: #0066cc; }
    .theirs { color: #cc6600; }
    input, button { font-size: 14px; padding: 6px; }
    #target { width: 60px; }
    #input { width: 300px; }
  </style>
</head>
<body>
  <h2>WebSocket Chat</h2>

  <div>
    <label>我是用户: <input id="userId" type="number" value="1" style="width:50px"></label>
    <button id="connectBtn">连接</button>
    <span id="status">未连接</span>
  </div>

  <div id="log"></div>

  <div>
    <label>发给: <input id="target" type="number" placeholder="留空广播"></label>
    <input id="input" type="text" placeholder="输入消息...">
    <button id="sendBtn">发送</button>
  </div>

  <p style="color:#888; font-size:12px; margin-top:20px;">
    打开两个浏览器标签，用不同用户 ID 连接，即可互相聊天。
  </p>

  <!-- 以下是 client.ts 编译后的 JS 版本，逻辑完全一致 -->
  <script>
    // ---- ChatClient（对应 client.ts）----
    class ChatClient {
      constructor(url) {
        this.ws = new WebSocket(url);
        this.handlers = new Map();
        this.ws.onmessage = (e) => this.dispatch(JSON.parse(e.data));
        this.ws.onopen = () => { document.getElementById("status").textContent = "已连接"; };
        this.ws.onclose = () => { document.getElementById("status").textContent = "已断开"; };
      }

      on(type, handler) {
        if (!this.handlers.has(type)) this.handlers.set(type, new Set());
        this.handlers.get(type).add(handler);
      }

      send(msg) {
        if (this.ws.readyState === WebSocket.OPEN) {
          this.ws.send(JSON.stringify(msg));
        }
      }

      chat(content, target) {
        this.send({ type: "chat", content, target });
      }

      dispatch(msg) {
        (this.handlers.get(msg.type) || []).forEach(fn => fn(msg));
      }
    }

    // ---- 页面交互 ----
    let client = null;
    const log = document.getElementById("log");

    function appendLog(text, cls = "") {
      const div = document.createElement("div");
      div.className = cls;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    document.getElementById("connectBtn").onclick = () => {
      const uid = document.getElementById("userId").value;
      const url = `ws://${location.host}/ws/${uid}`;
      client = new ChatClient(url);

      client.on("system", (msg) => appendLog(msg.content, "system"));
      client.on("chat", (msg) => {
        const cls = msg.from == uid ? "mine" : "theirs";
        appendLog(`用户${msg.from}: ${msg.content}`, cls);
      });
    };

    document.getElementById("sendBtn").onclick = () => {
      if (!client) return;
      const input = document.getElementById("input");
      const target = document.getElementById("target").value;
      client.chat(input.value, target ? Number(target) : undefined);
      input.value = "";
    };

    document.getElementById("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("sendBtn").click();
    });
  </script>
</body>
</html>
